    <script>
      // Bersihkan Service Worker dev-sw lama bila pernah terdaftar agar tidak memblokir pemuatan modul dev
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          var hadDevSw = false;
          var tasks = regs.map(function (reg) {
            var scriptUrl = (reg.active && reg.active.scriptURL) || (reg.waiting && reg.waiting.scriptURL) || (reg.installing && reg.installing.scriptURL) || '';
            if (scriptUrl.indexOf('dev-sw.js') !== -1) {
              hadDevSw = true;
              return reg.unregister();
            }
            return Promise.resolve(false);
          });
          Promise.all(tasks).then(function () {
            if (hadDevSw && 'caches' in window) {
              caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              }).then(function () {
                if (!sessionStorage.getItem('dc_sw_cleaned')) {
                  sessionStorage.setItem('dc_sw_cleaned', '1');
                  window.location.reload();
                }
              });
            }
          });
        });
      }
    </script>
  </head>

  </body>
